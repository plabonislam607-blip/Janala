<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Admin Panel — খবর বাংলা</title>
<meta name="robots" content="noindex, nofollow" />
<meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob: gap:; script-src * 'unsafe-inline' 'unsafe-eval'; style-src * 'unsafe-inline'; connect-src *; img-src * data: blob:; font-src * data:;">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ============================================================
   ADMIN PANEL — Complete Styles
   ============================================================ */
:root{
  --pri:#C8102E; --pri-d:#8B0A1F; --pri-l:#FEE2E2;
  --ok:#10B981; --warn:#F59E0B; --err:#EF4444; --info:#3B82F6;
  --ink:#111827; --ink-2:#374151; --gray:#6B7280; --gray-l:#9CA3AF;
  --bg:#F3F4F6; --card:#FFFFFF; --soft:#F9FAFB; --line:#E5E7EB;
  --sidebar:#1F2937; --sidebar-2:#111827;
  --r:10px; --r-sm:6px; --r-lg:16px;
  --sh:0 1px 3px rgba(0,0,0,.06); --sh-2:0 10px 30px rgba(0,0,0,.1);
  --font:'Hind Siliguri','Inter',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--font);background:var(--bg);color:var(--ink);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none}
button{cursor:pointer;border:none;background:none}
a{color:var(--pri);text-decoration:none}
a:hover{text-decoration:underline}
img{max-width:100%;display:block}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#D1D5DB;border-radius:9px}

/* ---------- Login Screen ---------- */
#loginScreen{
  position:fixed;inset:0;display:grid;place-items:center;
  background:linear-gradient(135deg,#1F2937 0%,#111827 100%);
  padding:20px;z-index:1000;
}
.login-card{
  background:#fff;border-radius:var(--r-lg);padding:36px 32px;
  width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.3);
}
.login-card .logo{
  width:64px;height:64px;border-radius:16px;background:var(--pri);
  color:#fff;font-weight:800;font-size:28px;display:grid;place-items:center;
  margin:0 auto 20px;
}
.login-card h1{font-size:24px;font-weight:800;text-align:center;margin-bottom:6px}
.login-card .sub{text-align:center;color:var(--gray);font-size:14px;margin-bottom:28px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--ink-2)}
.field input,.field textarea,.field select{
  width:100%;height:44px;border:1.5px solid var(--line);border-radius:var(--r-sm);
  padding:0 14px;font-size:15px;background:#fff;transition:.15s;
}
.field textarea{height:auto;min-height:100px;padding:10px 14px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{
  border-color:var(--pri);box-shadow:0 0 0 3px rgba(200,16,46,.08);
}
.btn{
  height:44px;border-radius:var(--r-sm);padding:0 20px;
  font-weight:700;font-size:15px;transition:.15s;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
}
.btn:active{transform:scale(.97)}
.btn-pri{background:var(--pri);color:#fff;width:100%}
.btn-pri:hover{background:var(--pri-d)}
.btn-pri:disabled{opacity:.6;pointer-events:none}
.btn-ghost{background:var(--soft);color:var(--ink-2);border:1.5px solid var(--line)}
.btn-ghost:hover{background:var(--line)}
.btn-ok{background:var(--ok);color:#fff}
.btn-err{background:var(--err);color:#fff}
.btn-sm{height:36px;padding:0 14px;font-size:13.5px}

/* ---------- Admin Layout ---------- */
#adminApp{display:none;min-height:100vh}
#adminApp.show{display:flex}

.sidebar{
  width:250px;background:var(--sidebar);color:#E5E7EB;
  display:flex;flex-direction:column;flex-shrink:0;
  position:fixed;top:0;bottom:0;left:0;z-index:100;
  transition:transform .25s;
}
.sidebar .brand{
  padding:20px;border-bottom:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;gap:12px;
}
.sidebar .brand .logo{
  width:40px;height:40px;border-radius:10px;background:var(--pri);
  color:#fff;font-weight:800;font-size:18px;display:grid;place-items:center;flex-shrink:0;
}
.sidebar .brand .txt h2{font-size:16px;font-weight:800;color:#fff}
.sidebar .brand .txt p{font-size:11px;color:#9CA3AF;margin-top:2px}
.sidebar nav{padding:14px 10px;flex:1;overflow-y:auto}
.sidebar nav a{
  display:flex;align-items:center;gap:12px;padding:11px 14px;
  border-radius:var(--r-sm);font-size:14.5px;font-weight:600;
  color:#D1D5DB;cursor:pointer;margin-bottom:2px;transition:.15s;
  text-decoration:none;
}
.sidebar nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.sidebar nav a.on{background:var(--pri);color:#fff}
.sidebar nav a .ic{font-size:18px;width:22px;text-align:center}
.sidebar nav .divider{
  padding:14px 14px 6px;font-size:11px;font-weight:800;color:#6B7280;
  letter-spacing:.8px;text-transform:uppercase;
}
.sidebar .user{
  padding:14px;border-top:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;gap:10px;font-size:13px;
}
.sidebar .user .av{
  width:36px;height:36px;border-radius:50%;background:var(--pri);
  display:grid;place-items:center;font-weight:800;color:#fff;flex-shrink:0;
}
.sidebar .user .em{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#9CA3AF}

.main{flex:1;margin-left:250px;min-width:0;display:flex;flex-direction:column}
.topbar{
  background:#fff;border-bottom:1px solid var(--line);
  padding:14px 24px;display:flex;align-items:center;gap:14px;
  position:sticky;top:0;z-index:50;box-shadow:var(--sh);
}
.topbar h1{font-size:20px;font-weight:800;flex:1}
.topbar .menu-btn{display:none;font-size:22px;color:var(--ink-2)}
.topbar .actions{display:flex;gap:8px;align-items:center}
.live-dot{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;font-weight:700;color:var(--ok);
  padding:5px 12px;border-radius:20px;background:#ECFDF5;
}
.live-dot::before{
  content:'';width:7px;height:7px;border-radius:50%;background:var(--ok);
  animation:pulse 1.5s infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.content{padding:24px;flex:1}

/* ---------- Cards / Grid ---------- */
.card{
  background:var(--card);border-radius:var(--r);box-shadow:var(--sh);
  padding:20px;margin-bottom:20px;
}
.card h3{
  font-size:17px;font-weight:800;margin-bottom:16px;
  display:flex;align-items:center;gap:8px;
}
.card h3::before{content:'▎';color:var(--pri);font-weight:800}

.stats{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:16px;margin-bottom:24px;
}
.stat{
  background:#fff;border-radius:var(--r);padding:18px;box-shadow:var(--sh);
  display:flex;align-items:center;gap:14px;
}
.stat .ic{
  width:48px;height:48px;border-radius:12px;display:grid;place-items:center;
  font-size:22px;flex-shrink:0;
}
.stat .ic.b1{background:#FEE2E2;color:#C8102E}
.stat .ic.b2{background:#DBEAFE;color:#2563EB}
.stat .ic.b3{background:#D1FAE5;color:#059669}
.stat .ic.b4{background:#FEF3C7;color:#D97706}
.stat .num{font-size:24px;font-weight:800;line-height:1.1}
.stat .lbl{font-size:13px;color:var(--gray);font-weight:600;margin-top:2px}

/* ---------- Forms ---------- */
.row{display:grid;gap:16px}
@media(min-width:640px){
  .row-2{grid-template-columns:1fr 1fr}
  .row-3{grid-template-columns:1fr 1fr 1fr}
}
.form-group{margin-bottom:18px}
.form-group label{
  display:block;font-size:13.5px;font-weight:700;margin-bottom:7px;color:var(--ink-2);
}
.form-group input,.form-group textarea,.form-group select{
  width:100%;height:44px;border:1.5px solid var(--line);border-radius:var(--r-sm);
  padding:0 14px;font-size:15px;background:#fff;transition:.15s;
}
.form-group textarea{height:auto;min-height:120px;padding:12px 14px;resize:vertical;line-height:1.6}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{
  border-color:var(--pri);box-shadow:0 0 0 3px rgba(200,16,46,.08);
}
.form-group .editor{border:1.5px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.form-group .editor:focus-within{border-color:var(--pri);box-shadow:0 0 0 3px rgba(200,16,46,.08)}
.form-group .editor textarea{
  border:none;border-radius:0;min-height:300px;
  font-family:'Consolas','Monaco',monospace;font-size:14px;
}
.form-group .editor textarea:focus{box-shadow:none}
.form-group .toolbar{
  background:var(--soft);padding:6px;border-bottom:1px solid var(--line);
  display:flex;gap:4px;flex-wrap:wrap;
}
.form-group .toolbar button{
  padding:6px 10px;border-radius:5px;font-size:13px;font-weight:700;
  color:var(--ink-2);background:transparent;
}
.form-group .toolbar button:hover{background:var(--line)}
.form-group .toolbar button.fmt{font-family:serif;font-style:italic;font-weight:700}

.checkbox-wrap{
  display:flex;align-items:center;gap:8px;font-size:14px;
  padding:8px 0;cursor:pointer;font-weight:600;
}
.checkbox-wrap input{width:18px;height:18px;accent-color:var(--pri);cursor:pointer}

/* ---------- Table ---------- */
.table-wrap{overflow-x:auto;border-radius:var(--r);background:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line)}
th{background:var(--soft);font-weight:800;font-size:12.5px;color:var(--gray);text-transform:uppercase;letter-spacing:.5px}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--soft)}
td img.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--soft)}
td .row-actions{display:flex;gap:6px}
td .row-actions button{
  padding:6px 10px;border-radius:6px;font-size:12.5px;font-weight:700;
  background:var(--soft);color:var(--ink-2);
}
td .row-actions button:hover{background:var(--line)}
td .row-actions .del{background:#FEE2E2;color:var(--err)}
td .row-actions .del:hover{background:var(--err);color:#fff}
td .row-actions .edit{background:#DBEAFE;color:var(--info)}
td .row-actions .edit:hover{background:var(--info);color:#fff}

.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:800}
.badge.ok{background:#D1FAE5;color:#059669}
.badge.warn{background:#FEF3C7;color:#D97706}
.badge.err{background:#FEE2E2;color:#DC2626}
.badge.info{background:#DBEAFE;color:#2563EB}
.badge.gray{background:var(--soft);color:var(--gray)}

/* ---------- Ad Position Guide ---------- */
.pos-guide{
  background:#FEF2F2;border:1.5px solid #FECACA;border-radius:var(--r);
  padding:18px;margin-bottom:20px;
}
.pos-guide h4{font-size:14px;font-weight:800;color:var(--pri);margin-bottom:12px}
.pos-guide table{font-size:13px}
.pos-guide th{background:#FEE2E2;color:var(--pri)}
.pos-guide th,.pos-guide td{padding:8px 12px;border-bottom:1px solid #FECACA}
.pos-guide code{
  background:#fff;padding:2px 8px;border-radius:4px;
  font-family:'Consolas',monospace;font-size:12.5px;color:var(--pri-d);
  font-weight:700;border:1px solid #FECACA;
}

/* ---------- Image Preview ---------- */
.img-preview{
  width:100%;max-width:280px;height:auto;border-radius:var(--r-sm);
  border:1.5px solid var(--line);margin-top:10px;
}

/* ---------- Toast ---------- */
#toasts{
  position:fixed;top:20px;right:20px;z-index:9999;
  display:flex;flex-direction:column;gap:10px;max-width:360px;
}
.toast{
  background:#fff;border-radius:var(--r);padding:14px 18px;
  box-shadow:0 10px 30px rgba(0,0,0,.15);font-size:14px;font-weight:600;
  display:flex;align-items:center;gap:10px;border-left:4px solid var(--info);
  animation:tin .3s ease;
}
.toast.ok{border-left-color:var(--ok)}
.toast.err{border-left-color:var(--err)}
.toast.warn{border-left-color:var(--warn)}
.toast .ic{font-size:18px}
@keyframes tin{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}

/* ---------- Modal ---------- */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;
  display:grid;place-items:center;padding:20px;animation:fi .2s;
}
@keyframes fi{from{opacity:0}to{opacity:1}}
.modal{
  background:#fff;border-radius:var(--r-lg);padding:24px;
  width:100%;max-width:520px;box-shadow:var(--sh-2);max-height:90vh;overflow-y:auto;
}
.modal h3{font-size:18px;font-weight:800;margin-bottom:16px}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

.hide{display:none !important}
.muted{color:var(--gray)}
.small{font-size:13px}
.mt-2{margin-top:12px}.mt-3{margin-top:20px}
.text-c{text-align:center}

@media(max-width:900px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .topbar .menu-btn{display:block}
  .content{padding:16px}
  .topbar{padding:12px 16px}
}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="logo">খ</div>
    <h1>Admin Panel</h1>
    <p class="sub">খবর বাংলা — নিউজ পোর্টাল ম্যানেজমেন্ট</p>
    <div class="field">
      <label>ইমেইল</label>
      <input id="loginEmail" type="email" placeholder="admin@example.com" autocomplete="username">
    </div>
    <div class="field">
      <label>পাসওয়ার্ড</label>
      <input id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn btn-pri" id="loginBtn" onclick="doLogin()">🔐 লগইন করুন</button>
    <p class="text-c small muted" style="margin-top:16px">
      শুধুমাত্র অনুমোদিত অ্যাডমিনরা প্রবেশ করতে পারবেন
    </p>
  </div>
</div>

<div id="adminApp">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">খ</div>
      <div class="txt">
        <h2 id="sbSiteName">খবর বাংলা</h2>
        <p>অ্যাডমিন প্যানেল</p>
      </div>
    </div>
    <nav id="sbNav">
      <a onclick="showPage('dashboard')" data-page="dashboard" class="on"><span class="ic">📊</span> ড্যাশবোর্ড</a>
      <a onclick="showPage('posts')" data-page="posts"><span class="ic">📝</span> পোস্ট</a>
      <a onclick="showPage('categories')" data-page="categories"><span class="ic">🗂️</span> ক্যাটাগরি</a>
      <a onclick="showPage('ads')" data-page="ads"><span class="ic">📢</span> বিজ্ঞাপন</a>
      <a onclick="showPage('pages')" data-page="pages"><span class="ic">📄</span> পেজ</a>
      <div class="divider">যোগাযোগ</div>
      <a onclick="showPage('messages')" data-page="messages"><span class="ic">✉️</span> মেসেজ</a>
      <div class="divider">সেটিংস</div>
      <a onclick="showPage('settings')" data-page="settings"><span class="ic">⚙️</span> সাইট সেটিংস</a>
    </nav>
    <div class="user">
      <div class="av" id="userAv">A</div>
      <div class="em" id="userEmail">admin@example.com</div>
      <button onclick="doLogout()" title="লগআউট" style="color:#9CA3AF;font-size:18px">⏻</button>
    </div>
  </aside>
  <div class="main">
    <div class="topbar">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <h1 id="pageTitle">ড্যাশবোর্ড</h1>
      <div class="actions"><span class="live-dot">Live</span></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div id="toasts"></div>

<!-- ═══ Firebase Compat SDK (ES module নয় — file:// এ কাজ করবে) ═══ -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
/* ================================================================
   ADMIN PANEL — খবর বাংলা (WebView Compatible)
   ================================================================ */

/* ─── Firebase Config ─── */
const firebaseConfig = {
  apiKey: "AIzaSyByj7ivxIa83NfcpZsHuHPQu4hX-KF_1pI",
  authDomain: "fir-e71c6.firebaseapp.com",
  databaseURL: "https://fir-e71c6-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "fir-e71c6",
  storageBucket: "fir-e71c6.firebasestorage.app",
  messagingSenderId: "121956148050",
  appId: "1:121956148050:web:7c69c2208289de1946908b"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.database();

/* ─── STATE ─── */
const A = {
  user: null,
  isAdmin: false,
  page: 'dashboard',
  data: { posts:{}, categories:{}, pages:{}, ads:{}, messages:{}, settings:{} },
  editingId: null,
  editingType: null,
  unsubs: []
};

/* ─── HELPERS ─── */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const num = v => { const n = Number(v); return isNaN(n) ? 0 : n; };
const now = () => Date.now();

function fmtDate(ts){
  if(!ts) return '—';
  try {
    return new Date(ts).toLocaleString('bn-BD', {
      day:'numeric', month:'short', year:'numeric',
      hour:'2-digit', minute:'2-digit'
    });
  } catch(e){ return new Date(ts).toDateString(); }
}

function toast(msg, type){
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.innerHTML = '<span class="ic">' +
    (type==='ok'?'✓':type==='err'?'✕':type==='warn'?'⚠':'ℹ') +
    '</span><span>' + esc(msg) + '</span>';
  $('#toasts').appendChild(el);
  setTimeout(()=>{
    el.style.transition='opacity .25s,transform .25s';
    el.style.opacity='0'; el.style.transform='translateX(20px)';
    setTimeout(()=>el.remove(), 260);
  }, 3200);
}

function confirmBox(msg){
  return new Promise(res => {
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML =
      '<div class="modal">' +
      '<h3>⚠️ নিশ্চিত করুন</h3>' +
      '<p style="color:var(--gray);font-size:14.5px">' + esc(msg) + '</p>' +
      '<div class="actions">' +
      '<button class="btn btn-ghost" id="cnNo">বাতিল</button>' +
      '<button class="btn btn-err" id="cnYes">হ্যাঁ, ডিলিট করুন</button>' +
      '</div></div>';
    document.body.appendChild(bg);
    bg.querySelector('#cnNo').onclick = () => { bg.remove(); res(false); };
    bg.querySelector('#cnYes').onclick = () => { bg.remove(); res(true); };
  });
}

/* ─── AUTH ─── */
window.doLogin = async function(){
  const email = $('#loginEmail').value.trim();
  const pass  = $('#loginPass').value;
  const btn   = $('#loginBtn');
  if(!email || !pass){ toast('ইমেইল ও পাসওয়ার্ড দিন', 'warn'); return; }
  btn.disabled = true;
  btn.textContent = 'লগইন হচ্ছে...';
  try {
    await auth.signInWithEmailAndPassword(email, pass);
    toast('সফলভাবে লগইন হয়েছে ✓', 'ok');
  } catch(e){
    console.error(e);
    let m = e.message || 'লগইন ব্যর্থ';
    if(e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password')
      m = 'ভুল ইমেইল বা পাসওয়ার্ড';
    if(e.code === 'auth/user-not-found') m = 'এই ইমেইলে কোনো অ্যাডমিন নেই';
    if(e.code === 'auth/too-many-requests') m = 'অনেকবার ভুল হয়েছে, কিছুক্ষণ পরে চেষ্টা করুন';
    if(e.code === 'auth/network-request-failed') m = 'ইন্টারনেট কানেকশন নেই';

auth.onAuthStateChanged(async (user) => {
  A.user = user || null;
  if(!user){
    $('#loginScreen').style.display = 'grid';
    $('#adminApp').classList.remove('show');
    return;
  }
  try {
    const snap = await db.ref('admins/' + user.uid).get();
    const data = snap.val();
    if(!data || data.active !== true){
      toast('আপনি অ্যাডমিন নন', 'err');
      await auth.signOut();
      return;
    }
    A.isAdmin = true;
    $('#userEmail').textContent = user.email || user.uid;
    $('#userAv').textContent = (user.email || 'A')[0].toUpperCase();
    $('#loginScreen').style.display = 'none';
    $('#adminApp').classList.add('show');
    startListeners();
    showPage('dashboard');
  } catch(e){
    console.error(e);
    toast('অ্যাডমিন যাচাই ব্যর্থ', 'err');
    await auth.signOut();
  }
});

/* ─── LISTENERS ─── */
function startListeners(){
  A.unsubs.forEach(u => { try{ u(); }catch(e){} });
  A.unsubs = [];

  const bind = (path, key, pages) => {
    const cb = s => {
      A.data[key] = s.val() || {};
      if(pages.includes(A.page)) renderPage();
    };
    const r = db.ref(path);
    r.on('value', cb);
    A.unsubs.push(() => r.off('value', cb));
  };

  bind('posts',      'posts',      ['posts','dashboard']);
  bind('categories', 'categories', ['categories','posts']);
  bind('pages',      'pages',      ['pages']);
  bind('ads',        'ads',        ['ads','dashboard']);
  bind('messages',   'messages',   ['messages','dashboard']);

  const scb = s => {
    A.data.settings = s.val() || {};
    if(A.page === 'settings') renderPage();
    if(A.data.settings.siteName) $('#sbSiteName').textContent = A.data.settings.siteName;
  };
  const sref = db.ref('settings/site');
  sref.on('value', scb);
  A.unsubs.push(() => sref.off('value', scb));
}

window.showPage = function(page){
  A.page = page;
  $$('#sbNav a').forEach(a => a.classList.toggle('on', a.dataset.page === page));
  const titles = {
    dashboard:'ড্যাশবোর্ড', posts:'পোস্ট ম্যানেজমেন্ট',

    settings:'সাইট সেটিংস'
  };
  $('#pageTitle').textContent = titles[page] || page;
  $('#sidebar').classList.remove('open');
  renderPage();
};

  if(A.page === 'posts')      c.innerHTML = viewPosts();
  if(A.page === 'categories') c.innerHTML = viewCategories();

window.insertTag = function(tag){
  const ta = $('#pfBody');
  if(!ta) return;
  const start = ta.selectionStart, end = ta.selectionEnd;
  const sel = ta.value.substring(start, end);
  let out = '';
  if(tag === 'a') out = '<a href="URL">' + (sel || 'লিংক টেক্সট') + '</a>';
  else if(tag === 'img') out = '<img src="IMAGE_URL" alt="">';
  else if(tag === 'ul') out = '<ul>\n  <li>' + (sel || 'আইটেম') + '</li>\n</ul>';
  else if(tag === 'blockquote') out = '<blockquote>' + (sel || 'উক্তি') + '</blockquote>';
  else out = '<' + tag + '>' + sel + '</' + tag + '>';
  ta.setRangeText(out, start, end, 'end');
  ta.focus();
};

window.savePost = async function(){
  const title = $('#pfTitle').value.trim();
  if(!title){ toast('শিরোনাম দিন', 'warn'); return; }

  const tagsRaw = $('#pfTags').value.trim();
  const tags = tagsRaw ? tagsRaw.split(',').map(s => s.trim()).filter(Boolean) : [];

  const data = {
    title,
    subtitle: $('#pfSubtitle').value.trim(),
    categoryId: $('#pfCat').value || '',
    author: $('#pfAuthor').value.trim(),
    excerpt: $('#pfExcerpt').value.trim(),
    image: $('#pfImage').value.trim(),
    body: $('#pfBody').value,
    tags,
    video: $('#pfVideo').value.trim(),
    seoTitle: $('#pfSeoTitle').value.trim(),
    seoDescription: $('#pfSeoDesc').value.trim(),
    featured: $('#pfFeatured').checked,
    breaking: $('#pfBreaking').checked,
    status: $('#pfDraft').checked ? 'draft' : 'published',
    updatedAt: now()
  };

  const btn = $('#pfSave');
  btn.disabled = true; btn.textContent = 'সেভ হচ্ছে...';

  try {
    if(A.editingId){
      await db.ref('posts/' + A.editingId).update(data);
      toast('আপডেট হয়েছে ✓', 'ok');
    } else {
      data.createdAt = now();
      data.publishedAt = data.status === 'published' ? now() : 0;
      data.views = 0;
      await db.ref('posts').push(data);
      toast('পোস্ট তৈরি হয়েছে ✓', 'ok');
    }
    A.editingId = null;
    showPage('posts');
  } catch(e){
    console.error(e);
    toast('সেভ ব্যর্থ: ' + (e.message||e), 'err');
  } finally {
    btn.disabled = false; btn.textContent = '💾 সেভ করুন';
  }
};

    await db.ref('settings/site').update(data);

  } catch(e){ toast('সেভ ব্যর্থ', 'err'); }
  finally { btn.disabled = false; btn.textContent = '💾 সেভ করুন'; }
};

console.log('[Admin Panel] loaded ✓ (WebView Compatible)');
</script>
